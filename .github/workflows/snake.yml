name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Generate Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: ShrutiSunilSawant
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#00C3E6
            dist/snake-light.svg?palette=github-light&color_snake=#00C3E6

      - name: Push Snake
        uses: EndBug/add-and-commit@v9
        with:
          message: "🐍 Update Snake Animation"
          add: "dist/"
